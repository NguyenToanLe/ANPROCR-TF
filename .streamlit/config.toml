[server]
headless = true # Recommended for cloud deployment

[runner]
magicEnabled = false # Set to true if you rely on Streamlit's magic commands

[browser]
gatherUsageStats = false

[global]
disableWatchdog = false # Set to true if you face issues with file change detection

[cloud]
# This is the crucial part:
# Tell Streamlit Cloud to run your start.sh script before starting the app.
pre_script_path = "start.sh"